<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인 · DayFlow</title>
    <meta name="theme-color" content="#25479E" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #16181d;
        --muted: #53565f;
        --accent: #25479e;
        --border: #c9ccd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #f2f4f8;
          --muted: #b6bcc9;
          --accent: #a9c0ff;
          --border: #3a4358;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          'Pretendard',
          system-ui,
          -apple-system,
          'Segoe UI',
          'Malgun Gothic',
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 32rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      button {
        min-height: 2.75rem;
        min-width: 2.75rem;
        padding: 0.625rem 1.25rem;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--accent);
        border: 0.0625rem solid transparent;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          color: #0b1220;
        }
      }
      button:focus-visible {
        outline: 0.1875rem solid var(--fg);
        outline-offset: 0.125rem;
      }
      svg {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        width="64"
        height="64"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M1 1l22 22" />
        <path d="M16.72 11.06A10.94 10.94 0 0119 12.55" />
        <path d="M5 12.55a10.94 10.94 0 015.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0122.58 9" />
        <path d="M1.42 9a15.91 15.91 0 014.7-2.88" />
        <path d="M8.53 16.11a6 6 0 016.95 0" />
        <path d="M12 20h.01" />
      </svg>
      <h1>지금은 오프라인입니다</h1>
      <p>
        인터넷에 연결되어 있지 않아 이 화면을 불러올 수 없습니다. 이미 저장된 일정은 앱에서 그대로 확인하고
        수정할 수 있으며, 변경 사항은 연결이 돌아오면 자동으로 동기화됩니다.
      </p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
