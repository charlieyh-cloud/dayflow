name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: 빌드 (GitHub Pages 서브경로 반영)
        run: npm run build
        env:
          # manifest 의 start_url·scope 와 SW 등록 경로가 이 값을 따른다.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA 폴백 (Pages 는 404.html 을 씀)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 프로덕션 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 배포 확인
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Service Worker 와 manifest 응답 확인
        run: |
          BASE="${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}"
          echo "확인 대상: $BASE"
          curl -fsS -o /dev/null "${BASE}sw.js" && echo "sw.js OK"
          curl -fsS -o /dev/null "${BASE}manifest.webmanifest" && echo "manifest OK"
