name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # 1~3, 7~8단계: 정적 검사 · 단위 테스트 · 빌드 · 번들 크기
  static:
    name: 린트 · 타입 · 단위 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: 1. 린트 (ESLint + jsx-a11y)
        run: npm run lint -- --max-warnings=0

      - name: 1b. 포맷 확인 (Prettier)
        run: npm run format:check

      - name: 2. 타입 체크
        run: npm run typecheck

      - name: 3. 단위 테스트 + 커버리지 (70% 미만 실패)
        run: npm run test:coverage

      - name: 8. 빌드
        run: npm run build

      - name: 7. 번들 크기 (앱 셸 200KB gzip 초과 시 실패)
        run: npm run size

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  # 4~5단계: E2E + 접근성 (axe critical/serious 1건이라도 있으면 실패)
  e2e:
    name: E2E · 접근성 (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: 4. E2E 테스트
        run: npx playwright test --project=chromium --project=mobile

      - name: 5. 접근성 검사 (axe-core)
        run: npx playwright test --project=a11y

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # 6단계: Lighthouse (Accessibility 100 / PWA / Performance 90)
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: 6. Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: .lighthouseci
          retention-days: 7
